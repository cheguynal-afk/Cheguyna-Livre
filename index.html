<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Syllabus</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px}
h1{text-align:center;color:#38bdf8;margin:10px}
.box{background:#1e293b;padding:15px;border-radius:10px}
input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;background:#020617;color:#fff}
button{width:100%;padding:12px;background:#38bdf8;border:0;border-radius:8px;font-weight:bold}
.card{background:#fff;color:#000;padding:12px;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<h1>📚 Mes Syllabus</h1>
<div class="box">
<input id="t" placeholder="Titre du syllabus">
<input id="c" placeholder="Cours / Prof">
<input id="l" placeholder="Lien Google Drive du PDF">
<button onclick="add()">ENREGISTRER</button>
</div>
<input id="s" placeholder="🔍 Rechercher" onkeyup="show()" style="margin-top:15px;background:#1e293b;border:1px solid #38bdf8">
<div id="list"></div>
<script>
let data=JSON.parse(localStorage.getItem('s')||'[]');
function add(){
if(!t.value)return alert('Titre!');
data.unshift({t:t.value,c:c.value,l:l.value,d:Date.now()});
localStorage.setItem('s',JSON.stringify(data));
t.value=c.value=l.value='';show();
}
function show(){
let q=s.value.toLowerCase(),h='';
data.forEach((x,i)=>{
if(x.t.toLowerCase().includes(q)){
h+=`<div class="card"><div><b>${x.t}</b><br><small>${x.c}</small></div><div><a href="${x.l}" target="_blank">Ouvrir</a> <button onclick="del(${i})" style="width:auto;background:red;color:#fff;padding:5px 10px">X</button></div></div>`;
}});
list.innerHTML=h||'<p style="text-align:center;opacity:.5;margin-top:20px">Aucun syllabus</p>';
}
function del(i){data.splice(i,1);localStorage.setItem('s',JSON.stringify(data));show();}
show();
</script>
</body>
</html>
