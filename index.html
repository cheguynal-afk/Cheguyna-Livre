<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheguyna Livre - Mes Syllabus</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px}
h1{text-align:center;color:#38bdf8}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #38bdf8;background:#1e293b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;color:#000;border-radius:12px;padding:10px;text-align:center}
.card .icon{font-size:40px}
.card b{font-size:13px;display:block;margin:5px 0;height:40px;overflow:hidden}
.btn{display:block;background:#0f172a;color:#fff;padding:8px;border-radius:8px;text-decoration:none;margin-top:5px;font-size:13px}
.btn2{background:#38bdf8;color:#000}
</style>
</head>
<body>
<h1>📚 Cheguyna Livre</h1>
<p style="text-align:center;opacity:.6">Tous mes syllabus en un clic</p>
<input id="s" placeholder="🔍 Rechercher un syllabus..." onkeyup="filtrer()">
<div class="grid" id="list"></div>

<script>
const livres = [
 {f:"9242544256_fre.pdf", t:"9242544256 - Cours"},
 {f:"9789240025868-fre.pdf", t:"9789240025868 - OMS"},
 {f:"9789242547825_fre.pdf", t:"9789242547825 - Manuel"},
 {f:"9789242548273_fre.pdf", t:"9789242548273 - Guide"},
 {f:"SAN438-Cours-de-Techniques-de-Communication-Medicale.pdf", t:"Techniques de Communication Médicale"},
 {f:"atlas-de-poche-d-hematologie.pdf", t:"Atlas de Poche d'Hématologie"}
];
function afficher(liste){
 let h=''; liste.forEach(b=>{
   h+=`<div class="card"><div class="icon">📕</div><b>${b.t}</b><a class="btn btn2" href="${b.f}" target="_blank">📖 Lire</a><a class="btn" href="${b.f}" download>Télécharger</a></div>`;
 });
 document.getElementById('list').innerHTML=h;
}
function filtrer(){
 let q=document.getElementById('s').value.toLowerCase();
 afficher(livres.filter(b=>b.t.toLowerCase().includes(q)));
}
afficher(livres);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
